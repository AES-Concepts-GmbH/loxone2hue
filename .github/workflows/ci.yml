name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (vet, gofmt, tests, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal)"
          if [ -n "$out" ]; then
            echo "Dateien nicht gofmt-formatiert:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          check-latest: true
          go-package: ./...

  web:
    name: Web UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  versions:
    name: Versionsstände konsistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Home Assistant pulls ghcr.io/.../loxone2hue-{arch}:<config.yaml version>,
      # so VERSION, the add-on config and the Web UI must agree.
      - name: VERSION, loxone2hue/config.yaml und web/package.json vergleichen
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          addon="$(sed -n 's/^version: *"\(.*\)"/\1/p' loxone2hue/config.yaml)"
          web="$(sed -n 's/^  "version": *"\(.*\)",/\1/p' web/package.json)"
          echo "VERSION=$version config.yaml=$addon package.json=$web"
          if [ "$version" != "$addon" ] || [ "$version" != "$web" ]; then
            echo "::error::Versionsstände weichen ab"
            exit 1
          fi

  addon-image:
    name: Add-on-Image baut (amd64, ohne Push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: loxone2hue/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.22
            BUILD_ARCH=amd64
            BUILD_VERSION=ci
            BUILD_DATE=ci
          cache-from: type=gha,scope=addon-amd64

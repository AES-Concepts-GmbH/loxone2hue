name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (vet, gofmt, tests, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal)"
          if [ -n "$out" ]; then
            echo "Dateien nicht gofmt-formatiert:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          check-latest: true
          go-package: ./...

  web:
    name: Web UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  addon-sync:
    name: Add-on-Quellbäume synchron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Die Add-ons tragen eine Kopie des Quellbaums (sync-addons.sh). Ein
      # Commit, der nur den Root-Baum aendert, liefert ein veraltetes Add-on.
      - name: Kopien mit Root-Quellbaum vergleichen
        run: |
          status=0
          for target in loxone2hue/src homeassistant/loxone2hue/src; do
            for dir in cmd internal web/src; do
              if ! diff -rq "$dir" "$target/$dir" >/dev/null; then
                echo "::error::$target/$dir weicht vom Root-Quellbaum ab (sync-addons.sh ausfuehren)"
                diff -rq "$dir" "$target/$dir" || true
                status=1
              fi
            done
            for f in go.mod go.sum VERSION web/package.json web/package-lock.json; do
              if ! cmp -s "$f" "$target/$f"; then
                echo "::error::$target/$f weicht vom Root ab (sync-addons.sh ausfuehren)"
                status=1
              fi
            done
          done
          exit $status

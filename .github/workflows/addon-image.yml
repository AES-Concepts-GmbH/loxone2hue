name: Add-on Image

# Builds the Home Assistant add-on image per architecture and publishes it to
# GitHub Container Registry. Home Assistant pulls
# ghcr.io/<owner>/loxone2hue-{arch}:<version> (loxone2hue/config.yaml: image),
# so every push to main must leave a published image for the version in
# VERSION. Tags v<version> publish the same images and are the release marker.
#
# The packages are private after their first push. Make them public once in
# GitHub (Packages -> loxone2hue-<arch> -> Package settings -> Change
# visibility), otherwise Home Assistant cannot pull them.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.22
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.22
          - arch: armv7
            platform: linux/arm/v7
            base: ghcr.io/home-assistant/armv7-base:3.22
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          addon="$(sed -n 's/^version: *"\(.*\)"/\1/p' loxone2hue/config.yaml)"
          if [ "$version" != "$addon" ]; then
            echo "::error::VERSION ($version) und loxone2hue/config.yaml ($addon) weichen ab"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: loxone2hue/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/loxone2hue-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/loxone2hue-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}

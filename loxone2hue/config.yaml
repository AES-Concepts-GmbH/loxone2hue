# Home Assistant Add-on Configuration
name: "Loxone2HUE Gateway"
description: "Gateway Service für bidirektionale Kommunikation zwischen Loxone und Philips HUE"
version: "1.4.2"
slug: "loxone2hue"
url: "https://github.com/AES-Concepts-GmbH/loxone2hue"
# Prebuilt per architecture by .github/workflows/addon-image.yml; the tag is
# the version above. Home Assistant pulls this instead of building locally.
image: "ghcr.io/aes-concepts-gmbh/loxone2hue-{arch}"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: false
host_network: true
panel_icon: "mdi:lightbulb-group"
panel_title: "Loxone2HUE"
ingress: true
ingress_port: 8080
ingress_stream: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Web UI und API"
map:
  - config:rw
options:
  hue_bridge_ip: ""
  hue_application_key: ""
  log_level: "info"
schema:
  hue_bridge_ip: str?
  hue_application_key: str?
  log_level: list(debug|info|warn|error)

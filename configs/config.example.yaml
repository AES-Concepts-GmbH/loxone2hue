server:
  port: 8080
  host: "0.0.0.0"

auth:
  # Leave the password empty to disable authentication — that is the previous
  # behaviour and what the Home Assistant Ingress setup expects, since Home
  # Assistant already guards access there. The web UI shows a warning until a
  # password is set (Einstellungen > Login-Schutz).
  # With a password set, the web UI, the API and the WebSocket require a login.
  # Loxone virtual outputs can supply it as HTTP basic auth (user:password@host).
  # A plain-text password written here is hashed on the next start and stored
  # as password_hash; five failed logins block the client address for 30 s.
  # /api/health stays open so the container health check keeps working.
  username: "admin"
  password: ""

hue:
  bridge_ip: ""           # Leave empty for auto-discovery
  application_key: ""     # Will be set during pairing

loxone:
  # One entry per Loxone Miniserver. Normally managed through the web frontend.
  miniservers: []
  # Example:
  # miniservers:
  #   - id: "generated-uuid"      # Stable ID, referenced by mappings
  #     name: "Miniserver"
  #     ip: "192.168.1.10"
  #     port: 7777                # UDP target port
  #     udp_enabled: true         # Send status updates via UDP
  #     http_enabled: false       # Send status updates via HTTP (virtual HTTP input)
  #     http_url: ""              # Optional, defaults to http://<ip>
  #     http_user: ""             # Sent as Basic Auth; over http:// this is clear text, use an https URL to encrypt
  #     http_password: ""
  #     http_verify_tls: false    # Verify the Miniserver certificate for https URLs (off: self-signed)
  #     send_all: false           # Also send updates for unmapped devices

logging:
  level: "info"           # debug, info, warn, error
  format: "json"          # json or console

# Mappings are configured via the web frontend
mappings: []

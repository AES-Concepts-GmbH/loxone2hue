# Loxone2HUE Gateway für Synology NAS
#
# Verwendung:
#   1. docker-compose up -d --build
#   2. Web-UI: http://<NAS-IP>:8080

services:
  loxone2hue:
    build:
      context: ..
      dockerfile: synology/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: loxone2hue:latest
    container_name: loxone2hue
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - loxone2hue-data:/data
    environment:
      - TZ=Europe/Zurich

volumes:
  loxone2hue-data:
